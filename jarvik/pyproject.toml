[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvik"
version = "2.0.0"
description = "JARVIK — a blue-themed terminal TUI chat client for OpenRouter models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.58.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
jarvik = "jarvik.app:main"

[tool.setuptools]
packages = ["jarvik"]
